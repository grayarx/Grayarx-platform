<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./shared.css" />
    <style>
      .frame {
        width: 1200px;
        height: 628px;
      }
      .bg {
        background-image: url("../../../client/public/corvette-exterior.jpg");
        background-position: 78% 46%;
      }
      .veil {
        background: linear-gradient(90deg, rgba(8, 8, 8, 0.96) 0%, rgba(8, 8, 8, 0.82) 46%, rgba(8, 8, 8, 0.18) 78%, rgba(8, 8, 8, 0.35) 100%);
      }
      .pad {
        position: relative;
        z-index: 2;
        height: 100%;
        padding: 40px 48px 36px;
        display: flex;
        flex-direction: column;
        max-width: 680px;
      }
      .brand img {
        width: 58px;
        height: 58px;
      }
      .wordmark strong {
        font-size: 18px;
      }
      .eyebrow {
        margin-top: 28px;
        font-size: 13px;
      }
      h1 {
        margin-top: 12px;
        font-size: 52px;
        max-width: 620px;
      }
      .sub {
        margin-top: 14px;
        font-size: 22px;
        max-width: 520px;
      }
      .cta {
        margin-top: auto;
        align-self: flex-start;
        padding: 13px 24px;
        font-size: 18px;
      }
      .proof {
        margin-top: 12px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="bg"></div>
      <div class="veil"></div>
      <div class="gold-edge"></div>
      <div class="pad">
        <div class="brand">
          <img src="../../../client/public/logo-crest.png" alt="GrayArx" />
          <div class="wordmark">
            <strong>GRAYARX</strong>
            <span>Nala Dealership OS</span>
          </div>
        </div>
        <div class="eyebrow">For dealer principals</div>
        <h1>Unanswered 9pm WhatsApps pay the <em>next yard</em>.</h1>
        <p class="sub">Nala replies from your live stock. 14-day Pilot. R0. No card.</p>
        <div class="cta">Start 14-day Pilot — no card</div>
        <div class="proof">CSV live the same day · 150 WhatsApp cap</div>
      </div>
    </div>
  </body>
</html>
